# リポジトリ直下から素の `docker compose up -d` で起動するためのエントリポイント。
# 実体は deploy/docker-compose.yml（Dockerfile・searxng 設定と同じ場所に集約）。
#   docker compose up -d              # 直下でそのまま
#   docker compose --profile web up -d
#   docker compose down               # 停止・撤去（ボリュームは残る）
# 従来どおり `docker compose -f deploy/docker-compose.yml ...` も同じプロジェクトで動く。
name: wick

include:
  - deploy/docker-compose.yml
